<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Days Countdown</title>
  <style>
    /* --- 馬卡龍紫配色設定 --- */
    :root {
      --main-bg: #F4F0F8;        /* 極淡紫藕灰白 */
      --card-bg: #FFFFFF;        /* 純白卡片 */
      --accent-color: #BFA8E8;   /* 主題色：馬卡龍紫 */
      --text-primary: #5D406B;   /* 深紫色文字 */
      --text-secondary: #9F8AB3; /* 淡紫色文字 */
      --cat-ear-color: #DBC7ED;  /* 耳朵內側淺紫 */
      font-family: 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
    }

    /* 深色模式設定 (適應 Notion Dark Mode) */
    @media (prefers-color-scheme: dark) {
      :root {
        --main-bg: #2F2F35;
        --card-bg: #3A3A42;
        --accent-color: #CBB2F5;
        --text-primary: #E8E0EE;
        --text-secondary: #B8A9C9;
        --cat-ear-color: #524263;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--main-bg);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background-color 0.3s;
    }

    .main-wrapper {
      position: relative;
      padding-top: 50px; /* 為了讓貓耳朵露出來 */
    }

    /* --- 貓咪造型 --- */
    .cat-ear {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 30px solid transparent;
      border-right: 30px solid transparent;
      border-bottom: 50px solid var(--cat-ear-color);
      z-index: 0;
      transition: border-bottom-color 0.3s;
    }
    .ear-left { left: 40px; }
    .ear-right { right: 40px; }

    /* --- 卡片主體 --- */
    .widget-card {
      background-color: var(--card-bg);
      width: 300px;
      border-radius: 30px;
      padding: 40px 20px 30px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      position: relative;
      z-index: 1; /* 在耳朵上面 */
      transition: background-color 0.3s, box-shadow 0.3s;
      border: 2px solid var(--accent-color);
    }

    /* 裝飾用的小圓點 (貓掌風格) */
    .dot-decoration {
      position: absolute;
      top: 15px;
      left: 20px;
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background-color: var(--cat-ear-color);
      border-radius: 50%;
      opacity: 0.5;
    }

    .event-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
      word-break: break-all;
    }

    .target-date-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 25px;
    }

    /* --- 只顯示天數 --- */
    .days-section {
      margin-bottom: 15px;
    }

    .number-large {
      font-size: 64px;
      font-weight: 900;
      color: var(--accent-color);
      line-height: 1;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums; /* 數字等寬，跳動時不跑版 */
    }

    .label-small {
      font-size: 14px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    /* --- 底部裝飾 --- */
    .footer-line {
      height: 6px;
      background-color: var(--accent-color);
      width: 60px;
      margin: 0 auto;
      border-radius: 3px;
      margin-top: 25px;
      opacity: 0.7;
    }

    /* 過期樣式 */
    .expired-msg {
      font-size: 22px;
      color: var(--accent-color);
      font-weight: bold;
      padding: 20px 0;
    }

  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- 貓耳朵 -->
    <div class="cat-ear ear-left"></div>
    <div class="cat-ear ear-right"></div>

    <!-- 卡片內容 -->
    <div class="widget-card">
      <div class="dot-decoration">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="event-title" id="event-title">載入中...</div>
      <div class="target-date-label" id="target-date-display"></div>

      <div class="days-section" id="countdown-area">
        <div class="number-large" id="days-count">0</div>
        <div class="label-small">DAYS LEFT</div>
      </div>
      
      <div class="footer-line"></div>
    </div>
  </div>

  <script>
    // --- 設定區域 ---
    // 請在此處設定預設值 (若網址沒有參數時顯示)
    const DEFAULT_TITLE = "未設定活動";
    const DEFAULT_DATE = "2025-12-31"; // 預設日期

    // --- 程式邏輯 ---
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title") || DEFAULT_TITLE;
    // 支援 YYYY.MM.DD 或標準 YYYY-MM-DD 格式
    const dateParam = (params.get("date") || DEFAULT_DATE).replace(/\./g, '-');
    
    document.getElementById("event-title").textContent = title;

    // 設定目標時間為當天的 00:00:00，確保只計算日期
    const targetDate = new Date(dateParam);
    targetDate.setHours(0, 0, 0, 0); 

    const _second = 1000;
    const _minute = _second * 60;
    const _hour = _minute * 60;
    const _day = _hour * 24;
    let timer;

    function showComplete() {
      clearInterval(timer);
      document.getElementById("countdown-area").innerHTML = 
        '<div class="expired-msg">就是今天！</div>';
      document.getElementById("target-date-display").style.display = 'none';
    }

    function updateCountdown() {
      const now = new Date();
      // 計算兩個日期的毫秒數差距
      const distance = targetDate.getTime() - now.getTime();

      // 如果距離小於 0，表示時間已過或就是今天
      // 因為我們設定目標時間是 00:00，所以只要現在超過 00:00 就顯示就是今天
      if (distance < 0) {
        showComplete();
        return;
      }

      // 計算天數 (無條件捨去)
      const days = Math.floor(distance / _day);

      // 更新畫面
      document.getElementById("days-count").textContent = days;
      
      // 顯示目標日期文字
      document.getElementById("target-date-display").textContent = 
        targetDate.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    // 初始化
    if (isNaN(targetDate.getTime())) {
       document.getElementById("event-title").textContent = "日期格式錯誤";
       document.getElementById("countdown-area").innerHTML = '<div class="label-small" style="color:red">Use YYYY-MM-DD</div>';
    } else {
       updateCountdown();
       // 每分鐘更新一次即可 (因為只顯示天，不需要每秒更新)
       timer = setInterval(updateCountdown, 60000); 
    }

  </script>
</body>
</html>
