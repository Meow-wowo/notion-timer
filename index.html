<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Days Countdown</title>
  <style>
    :root {
      --main-bg: #F4F0F8;        /* 極淡紫藕灰白 */
      --card-bg: #FFFFFF;        /* 純白卡片 */
      --accent-color: #BFA8E8;   /* 主題色：馬卡龍紫 */
      --text-primary: #5D406B;   /* 深紫色文字 */
      --text-secondary: #9F8AB3; /* 淡紫色文字 */
      --cat-ear-color: #DBC7ED;  /* 耳朵內側淺紫 */
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --main-bg: #191919;
        --card-bg: #2A2630;
        --accent-color: #CBB2F5;
        --text-primary: #E8E0EE;
        --text-secondary: #B8A9C9;
        --cat-ear-color: #524263;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--main-bg);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }

    .main-wrapper {
      position: relative;
      padding-top: 38px;
    }

    /* 貓耳朵 */
    .cat-ear {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 26px solid transparent;
      border-right: 26px solid transparent;
      border-bottom: 44px solid var(--cat-ear-color);
      z-index: 0;
    }
    .ear-left { left: 36px; }
    .ear-right { right: 36px; }

    /* 卡片主體 */
    .widget-card {
      background-color: var(--card-bg);
      width: 260px;
      border-radius: 28px;
      padding: 32px 20px 26px 20px;
      box-shadow: 0 8px 20px rgba(93, 64, 107, 0.08);
      position: relative;
      z-index: 1;
      border: 2px solid var(--accent-color);
      text-align: center;
    }

    /* 貓掌小圓點裝飾 */
    .dot-decoration {
      position: absolute;
      top: 14px;
      left: 18px;
      display: flex;
      gap: 5px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--cat-ear-color);
      border-radius: 50%;
      opacity: 0.7;
    }

    .target-date-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .number-large {
      font-size: 68px;
      font-weight: 900;
      color: var(--accent-color);
      line-height: 1;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }

    .label-small {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .footer-line {
      height: 5px;
      background-color: var(--accent-color);
      width: 48px;
      margin: 20px auto 0 auto;
      border-radius: 3px;
      opacity: 0.7;
    }

    .expired-msg {
      font-size: 24px;
      color: var(--accent-color);
      font-weight: 800;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="cat-ear ear-left"></div>
    <div class="cat-ear ear-right"></div>

    <div class="widget-card">
      <div class="dot-decoration">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="target-date-label" id="target-date-display">2027.01.09</div>

      <div id="countdown-area">
        <div class="number-large" id="days-count">0</div>
        <div class="label-small">DAYS LEFT</div>
      </div>

      <div class="footer-line"></div>
    </div>
  </div>

  <script>
    const DEFAULT_DATE = "2027-01-09";
    const params = new URLSearchParams(window.location.search);
    const dateParam = (params.get("date") || DEFAULT_DATE).replace(/\./g, "-");

    // 拆解年月日，避免瀏覽器時區誤差導致少算一天
    const parts = dateParam.split("-");
    const targetDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 0, 0, 0);

    function updateCountdown() {
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
      const diffDays = Math.round((targetDate - todayStart) / (1000 * 60 * 60 * 24));

      if (isNaN(diffDays)) {
        document.getElementById("target-date-display").textContent = "DATE ERROR";
        return;
      }

      const yyyy = targetDate.getFullYear();
      const mm = String(targetDate.getMonth() + 1).padStart(2, "0");
      const dd = String(targetDate.getDate()).padStart(2, "0");
      document.getElementById("target-date-display").textContent = `${yyyy}.${mm}.${dd}`;

      if (diffDays <= 0) {
        document.getElementById("countdown-area").innerHTML =
          '<div class="expired-msg">TODAY!</div>';
      } else {
        document.getElementById("days-count").textContent = diffDays;
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 60000);
  </script>
</body>
</html>
